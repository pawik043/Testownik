[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Testownik"
version = "1.0.0"
description = "A quiz and flashcard application"
authors = [{name = "Your Name"}]
dependencies = [
    "PySide6==6.11.0",
    "PySide6-Addons==6.11.0",
    "PySide6-Essentials==6.11.0",
    "shiboken6==6.11.0",
]
requires-python = ">=3.8"

[project.scripts]
testownik = "Testownik:main"

[tool.setuptools]
py-modules = ["Testownik", "app_entry", "quiz_app", "install"]
packages = { find = { include = ["services", "ui", "widgets", "models"] } }
